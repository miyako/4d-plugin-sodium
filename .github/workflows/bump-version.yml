name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: bump coordinated source version
        id: bump
        env:
          MODE: ${{ inputs.mode }}
          SELECTED_BRANCH: ${{ github.ref_name }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REMOTE_SHA=$(git ls-remote --exit-code origin "refs/heads/$SELECTED_BRANCH" | cut -f1)
          if [ "$REMOTE_SHA" != "$SELECTED_SHA" ]; then
            echo "Selected branch moved; dispatch Bump version again." >&2
            exit 1
          fi
          NEW=$(python3 .github/scripts/release.py bump --mode "$MODE")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${NEW}"
          git push origin "HEAD:refs/heads/$SELECTED_BRANCH"
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

      - name: summary
        run: echo "### Bumped source metadata to ${{ steps.bump.outputs.version }}. No tag or release created. Run Build separately on the intended branch." >> "$GITHUB_STEP_SUMMARY"
